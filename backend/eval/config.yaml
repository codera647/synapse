# Synapse evaluation harness — config (DOUBLE-BENCH + complementary metrics).
# Secrets come from the backend env (/etc/synapse/backend.env): SUPABASE_URL,
# SUPABASE_SERVICE_ROLE_KEY, R2_*, OPENAI_API_KEY.

run_id: drive100                     # the manually-created Drive library run
backend_url: http://127.0.0.1:8000   # FastAPI backend (must be running)

# ---- DOUBLE-BENCH dataset (Episoode/Double-Bench on HuggingFace) --------------------------
# Two query configs: single-hop and multi-hop. Documents live in docs.tar.gz (23GB, page images)
# and ocr.tar.gz (66MB, per-page OCR text). We use the OCR text -> build a digital text PDF per
# doc (page-accurate, free: PyMuPDF reads text, no VLM). reference_page is 0-based.
dataset:
  hf_dataset_id: Episoode/Double-Bench
  configs: [single-hop, multi-hop]
  local_dir: data/double_bench         # downloads + normalized jsonl + built corpus land here
  doc_source: page_images               # page_images = real pipeline (layout->...->cluster, VLM caption)
                                         # | ocr_text = cheap text-IR injection (no VLM)
  docs_tar_path: ""                     # optional: path to a pre-downloaded docs.tar.gz (else stream from HF)
  lang_folders: { en: English, ar: Arabic, fr: French, es: Spanish, ja: Japanese, zh: Chinese }

# ---- Stratified DEMO sample --------------------------------------------------------------
sample:
  seed: 17
  max_docs: 50                          # 50 English docs for the real-pipeline run
  languages: [en]                       # English only (clean headline; bge-m3 is multilingual either way)
  doc_types: [pdf, scanned, html]       # no slides/ppt
  per_stratum_docs: null                # null = balanced round-robin across (lang x doc_type) ~ 17/17/16

# ---- Retrieval (free; runs on ALL sampled queries) ---------------------------------------
retrieval:
  top_k: 5                              # paper setting (hit@1/3/5 from top-5)
  match_level: doc                      # doc = "retrieved the right document?" (robust for the Drive
                                         # library where rebuilt text-PDFs don't keep exact page #s).
                                         # Use `page` only when ingested PDFs preserve benchmark pages.
  page_offset: 0
  concurrency: 8

# ---- Judged answer slice (paid; deep mode + dual judge) ----------------------------------
answer:
  thinking_mode: high                   # DEEP mode for chat answers
  answer_slice_size: 28                 # queries to fully judge (deep mode, ~$9 of the $10 pool)
  concurrency: 2
  judges: [gpt-4o, gpt-5.5]             # dual judge
  ragas_llm: gpt-4o-mini                # cheap model for RAGAS internal grading

# ---- Hard budget cap (never overrun the OpenAI pool) -------------------------------------
budget:
  max_openai_spend_usd: 9.5
  deep_query_cost_usd: 0.30             # flat estimate per deep /chat (tokens unseen via HTTP)
  prices:
    gpt-4o:      { input: 2.5,  output: 10.0 }
    gpt-4o-mini: { input: 0.15, output: 0.6 }
    gpt-5.5:     { input: 2.5,  output: 10.0 }
